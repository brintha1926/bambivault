[mypy]
python_version = 3.12
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True

# Strict checks are enabled incrementally for typed modules.
[mypy-feature_extraction]
disallow_untyped_defs = True

[mypy-strengthen]
disallow_untyped_defs = True

[mypy-config]
disallow_untyped_defs = True

[mypy-security_utils]
disallow_untyped_defs = True

[mypy-migrate_sqlite_to_postgres]
disallow_untyped_defs = True

# Flask-SQLAlchemy creates db.Model dynamically.
[mypy-models]
disable_error_code = name-defined
