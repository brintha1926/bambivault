<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BambiVault — Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .login-wrap {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      max-width: 380px;
      width: 100%;
      padding: 2.2rem;
      border: 1px solid rgba(0,255,200,.18);
      border-radius: 14px;
      background: rgba(255,255,255,.02);
    }
    .login-card h2 {
      font-family: var(--mono, monospace);
      font-size: 1.15rem;
      margin-bottom: .3rem;
    }
    .login-sub { color: var(--muted, #888); font-size: .82rem; margin-bottom: 1.6rem; }
    .login-input {
      width: 100%;
      padding: .8rem 1rem;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      color: #fff;
      font-size: .9rem;
      margin-bottom: 1rem;
    }
    .login-btn {
      width: 100%;
      padding: .8rem;
      background: #00ffc8;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: .85rem;
      letter-spacing: .03em;
    }
    .login-err {
      color: #ef4444;
      font-size: .8rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
<div class="grid-bg"></div>
<nav class="navbar">
  <div class="nav-brand">
    <span class="brand-name">Bambi<span class="brand-acc">Vault</span></span>
  </div>
  <div class="nav-status"><span class="sdot"></span>Admin Access</div>
</nav>

<main class="container">
  <div class="login-wrap">
    <div class="login-card">
      <h2>Administrator Login</h2>
      <p class="login-sub">Institutional access only.</p>

      {% if error %}
      <div class="login-err">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <input type="password" name="password" class="login-input" placeholder="Admin password" required autofocus>
        <button type="submit" class="login-btn">SIGN IN</button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
