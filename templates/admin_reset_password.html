{% extends "public_base.html" %}
{% block title %}BambiVault | Set administrator password{% endblock %}
{% block public_content %}
<div class="auth-shell"><div class="auth-card" role="region" aria-labelledby="reset-title">
  <h1 class="auth-title" id="reset-title">Set a new administrator password</h1>
  <p class="auth-sub">Use a unique password with at least 12 characters.</p>
  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="field"><label class="field-label" for="password">New password</label><input class="input" type="password" id="password" name="password" minlength="12" autocomplete="new-password" required autofocus></div>
    <div class="field"><label class="field-label" for="confirm">Confirm new password</label><input class="input" type="password" id="confirm" name="confirm" minlength="12" autocomplete="new-password" required></div>
    <button class="btn btn-primary btn-block" type="submit">Update password</button>
  </form>
</div></div>
{% endblock %}
